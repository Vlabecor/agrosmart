<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 462" width="400" height="462">
  <defs>
    <linearGradient id="colGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#66d47e"/>
      <stop offset="50%" stop-color="#46b464"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <filter id="colGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#46b464" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!--
    Coordenadas GeoJSON oficiales de Colombia transformadas a SVG.
    Fuente: world.geo.json / Natural Earth
    Bounds: lng [-78.99, -66.88], lat [-4.30, 12.44]
    
    Fórmula de proyección:
      scale = 27.48 px/grado
      toX(lng) = 20 + (lng + 78.99) * 27.48
      toY(lat) = 20 + (12.44 - lat) * 27.48
    
    Puntos clave verificados:
      Cabo Gallinas (12.44°N, 72.0°W) → x=195, y=20  [norte extremo]
      Leticia (-4.21°S, 69.94°W)       → x=248, y=460 [sur extremo]
      Cabo Corrientes (5.5°N, 77.6°W)  → x=38, y=192  [oeste extremo]
      Serranía de Chiribiquete          → x=320, y=230  [este aprox]
  -->

